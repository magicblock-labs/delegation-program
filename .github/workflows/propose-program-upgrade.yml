name: Propose Program Upgrade

# Builds dlp verifiably and opens a Squads proposal that upgrades the program
# and records its otter-verify PDA. Members approve and execute in Squads.
#
# Each cluster is a GitHub environment named <cluster>-program-upgrade with:
#   secrets   RPC_URL, SQUADS_PROPOSER_KEYPAIR (Initiate-only multisig member)
#   variable  SQUADS_MULTISIG_PDA (multisig whose vault is the upgrade authority)

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: Target cluster
        type: choice
        options: [devnet, mainnet]
        default: devnet
      proposal_name:
        description: Squads proposal memo
        default: Upgrade delegation program
      dry_run:
        description: Build, upload and simulate only; close the buffer without proposing
        type: boolean
        default: false

concurrency: program-upgrade-${{ inputs.cluster }}

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.cluster }}-program-upgrade

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: magicblock-labs/.github/actions/squads-program-upgrade@d5afca7fc30a89e3a735ae358094eaa7b8157fc2
        with:
          rpc-url: ${{ secrets.RPC_URL }}
          proposer-keypair: ${{ secrets.SQUADS_PROPOSER_KEYPAIR }}
          multisig: ${{ vars.SQUADS_MULTISIG_PDA }}
          program-id: DELeGGvXpWV2fqJUhqcF5ZSYMS4JTLjteaAMARRSaeSh
          library-name: dlp
          proposal-name: ${{ inputs.proposal_name }}
          dry-run: ${{ inputs.dry_run }}
