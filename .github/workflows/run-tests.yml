name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:

env:
  solana_version: v3.1.5
  anchor_version: 0.31.1

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        name: cache solana cli
        id: cache-solana
        with:
          path: |
            ~/.cache/solana/
            ~/.local/share/solana/
          key: solana-${{ runner.os }}-v0000-${{ env.solana_version }}

      - name: install essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libudev-dev
          npm install --global yarn

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - name: install solana
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${{ env.solana_version }}/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

  lint:
    needs: install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run fmt
        run: rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt && cargo +nightly fmt -- --check
      - name: Run clippy
        run: cargo clippy --workspace -- --deny=warnings

  test:
    needs: [install, lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        name: cache solana cli
        id: cache-solana
        with:
          path: |
            ~/.cache/solana/
            ~/.local/share/solana/
          key: solana-${{ runner.os }}-v0000-${{ env.solana_version }}

      - name: setup solana
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-keygen new --silent --no-bip39-passphrase

      - name: log disk space
        run: df -h

      - name: run build
        run: cargo build --workspace

      - name: run interface tests
        run: cargo test --manifest-path interface/Cargo.toml

      - name: run interface tests with backward compatibility
        run: cargo test --manifest-path interface/Cargo.toml --features backward-compat

      - name: run client tests
        run: cargo test --manifest-path client/Cargo.toml

      - name: run client diff tests
        run: cargo test --manifest-path client/Cargo.toml --no-default-features --features diff

      - name: run client encryption tests
        run: cargo test --manifest-path client/Cargo.toml --no-default-features --features encryption

      - name: run tests (cargo test-sbf)
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          cargo test-sbf --manifest-path program/Cargo.toml --features unit_test_config

      - name: compile production version for integration tests
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          cargo build-sbf --manifest-path program/Cargo.toml

      - name: clean up before integration tests
        run: |
          cp target/deploy/delegation_program.so /tmp/delegation_program.so
          rm -rf target
          mkdir -p target/deploy && cp /tmp/delegation_program.so target/deploy/delegation_program.so
          rm -rf ~/.cache
          rm -rf ~/.cargo/registry
          df -h

      - name: run integration tests
        run: |
          export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
          cargo install --locked --version ${{ env.anchor_version }} anchor-cli
          npm --prefix integration-tests/anchor install
          ./scripts/run-anchor-tests.sh
