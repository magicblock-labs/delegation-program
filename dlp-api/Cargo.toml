[package]
name = "magicblock-delegation-program-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "dlp_api"

[features]
# Offchain encryption/decryption helpers (libsodium + solana-sdk)
encryption = ["dep:libsodium-rs", "dep:solana-sdk"]

# Default to offchain-friendly build
default = ["encryption"]

[dependencies]
# core program crate
dlp = { package = "magicblock-delegation-program", path = "..", default-features = false, features = ["sdk"] }

# sdk deps
solana-program = { version = ">=1.16, <3.0.0" }
solana-sdk = { version = ">=1.16, <3.0.0", optional = true }
libsodium-rs = { version = "0.2.0", optional = true }

borsh = { version = "1.5.3", features = ["derive"] }
bincode = { version = "^1.3" }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
thiserror = { version = ">=1" }

[dev-dependencies]
dlp = { package = "magicblock-delegation-program", path = "..", default-features = false, features = [
    "unit_test_config" 
] }
spl-token = "4.0.0"
