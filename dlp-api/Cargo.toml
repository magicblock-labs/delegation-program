[package]
name = "dlp-api"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "dlp_api"

[dependencies]
# core program crate
dlp = { package = "magicblock-delegation-program", path = ".." }

# sdk deps
solana-program = { version = ">=1.16, <3.0.0" }
solana-sdk = { version = ">=1.16" }
rand = { version = "=0.8.5", features = ["small_rng"] }
libsodium-rs = { version = "0.2.0" }

borsh = { version = "1.5.3", features = ["derive"] }
bincode = { version = "^1.3" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { version = ">=1" }

[dev-dependencies]
dlp = { package = "magicblock-delegation-program", path = "..", features = ["unit_test_config"] }
spl-token = "4.0.0"
