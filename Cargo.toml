[package]
name = "magicblock-delegation-program"
description = "Delegation program for the Ephemeral Rollups"
version = "1.1.0"
authors = ["Magicblock Labs <dev@magicblock.gg>"]
edition = "2021"
license = "MIT"
homepage = "https://www.magicblock.gg/"
documentation = "https://docs.magicblock.gg/"
repository = "https://github.com/magicblock-labs/delegation-program"
readme = "./README.md"
keywords = ["solana", "crypto", "delegation", "ephemeral-rollups", "magicblock"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
overflow-checks = false

[lib]
crate-type = ["cdylib", "lib"]
name = "dlp"

[features]
no-entrypoint = []
default = ["solana-security-txt"]
unit_test_config = []

[dependencies]
borsh = "0.10.4"
paste = "^1.0"
solana-program = "2.2"
solana-program-error = "2.2"
bytemuck = { version = "1.21", features = ["derive"] }
num_enum = "^0.7.2"
light-compressed-account = { version = "0.3.0", features = ["solana"] }
light-hasher = { version = "3.1.0", features = ["solana"] }
light-macros = { version = "2.1.0", features = ["solana"] }
light-sdk = "0.13.0"
light-sdk-types = "0.13.0"
thiserror = "^1.0.57"
solana-security-txt = { version = "1.1.1", optional = true }
solana-curve25519 = "2.2"
bincode = "1.3.3"

[dev-dependencies]
base64 = "0.22.1"
light-program-test = "0.14.0"
light-client = "0.14.0"
rand = "0.8.5"
solana-program-test = "2.2"
solana-sdk = "2.2"
tokio = { version = "1.0", features = ["full"] }
magicblock-delegation-program = { path = ".", features = ["unit_test_config"] }
