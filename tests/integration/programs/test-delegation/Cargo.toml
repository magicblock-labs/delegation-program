[package]
name = "test-delegation"
version = "0.1.4"
description = "Created with Bolt"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_delegation"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "ephemeral-rollups-sdk/idl-build"]
# idl-build = []
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.31.1"
ephemeral-rollups-sdk = { git = "https://github.com/magicblock-labs/ephemeral-rollups-sdk", rev = "f8b363e", features = [
    "anchor",
    "light",
] }
# ephemeral-rollups-sdk = { path = "../../../../../ephemeral-rollups-sdk/rust/sdk", features = [
#     "anchor",
#     "light",
# ] }
